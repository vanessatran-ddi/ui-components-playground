<goab-menu-button text="Menu Button" type="primary" (onAction)="onMenuAction($event)">
  <goab-menu-action text="Edit" action="edit" icon="create"></goab-menu-action>
  <goab-menu-action text="View" action="view" icon="eye"></goab-menu-action>
  <goab-menu-action text="Delete" action="delete" icon="trash"></goab-menu-action>
</goab-menu-button>

<h3>Secondary Menu Button</h3>
<goab-menu-button text="Actions" type="secondary" (onAction)="onMenuAction($event)">
  <goab-menu-action text="Copy" action="copy" icon="copy"></goab-menu-action>
  <goab-menu-action text="Share" action="share" icon="share"></goab-menu-action>
  <goab-menu-action text="Print" action="print" icon="print"></goab-menu-action>
</goab-menu-button>

<h3>Tertiary Menu Button</h3>
<goab-menu-button text="Options" type="tertiary" (onAction)="onMenuAction($event)">
  <goab-menu-action text="Settings" action="settings" icon="settings"></goab-menu-action>
  <goab-menu-action text="Help" action="help" icon="help"></goab-menu-action>
</goab-menu-button>

<h3>CompactMenu Button</h3>
<goab-menu-button text="Options" type="primary" size="compact" (onAction)="onMenuAction($event)">
  <goab-menu-action text="Settings" action="settings" icon="settings"></goab-menu-action>
  <goab-menu-action text="Help" action="help" icon="help"></goab-menu-action>
</goab-menu-button>
