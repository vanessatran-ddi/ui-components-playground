<div *ngIf="formStateDisplay" style="margin: 20px; padding: 20px; background-color: #f5f5f5; border: 1px solid #ddd; border-radius: 5px;">
  <h3>Form State at completion:</h3>
  <pre style="white-space: pre-wrap; word-break: break-word;">{{ formStateDisplay }}</pre>
</div>

<goab-public-form
  name="issue2827-form"
  (onComplete)="onCompleteIssue2827($event)"
  (onInit)="init($event)"
>
  <goab-public-form-page
    id="first-step"
    heading="Issue 2827 Only 1 field"
    [first]="true"
    buttonText="Continue to review"
    (onContinue)="onContinue($event, 'first-step')"
  >
    <goab-fieldset mt="xl">
      <goab-form-item label="First name">
        <goab-input name="firstName"></goab-input>
      </goab-form-item>
    </goab-fieldset>
  </goab-public-form-page>

  <goab-public-form-page
    id="summary"
    type="summary"
    heading="Summary"
  >
    <goab-public-form-summary></goab-public-form-summary>
  </goab-public-form-page>
</goab-public-form>
