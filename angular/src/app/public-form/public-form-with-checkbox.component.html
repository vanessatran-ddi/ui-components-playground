      <goab-public-form
        name="public-form-checkbox-list"
        (onComplete)="showConfirmation($event)"
        (onInit)="init($event)"
      >
        <goab-public-form-page
          id="communication"
          heading="Communication Preferences"
          summaryHeading="Communication"
          (onContinue)="onPageChange($event, 'communication')"
        >
          <goab-fieldset>
            <goab-form-item
              id="contact-methods"
              name="Contact Methods"
              label="How would you like to be contacted?"
              labelSize="large"
              helpText="Select all methods that apply to you"
              [publicFormSummaryOrder]="1"
            >
              <goab-checkbox-list name="contact-methods" [value]="contactMethodsValue" (onChange)="onContactMethodsChange($event)">
                <goab-checkbox name="email" value="email" text="Email notifications"></goab-checkbox>
                <goab-checkbox name="phone" value="phone" text="Phone calls, business hours only"></goab-checkbox>
                <goab-checkbox name="sms" value="sms" text="SMS/Text messages"></goab-checkbox>
                <goab-checkbox name="mail" value="mail" text="Regular mail, letters, packages"></goab-checkbox>
              </goab-checkbox-list>
            </goab-form-item>

            <goab-form-item
              id="newsletter-subscriptions"
              name="Newsletter Subscriptions"
              label="Newsletter Subscriptions"
              helpText="Optional newsletter subscriptions"
              [publicFormSummaryOrder]="2"
            >
              <goab-checkbox-list name="newsletter-subscriptions" [value]="newsletterSubscriptionsValue" (onChange)="onNewsletterSubscriptionsChange($event)">
                <goab-checkbox name="weekly" value="weekly" text="Weekly Newsletter, Alberta Today"></goab-checkbox>
                <goab-checkbox name="monthly" value="monthly" text="Monthly Updates"></goab-checkbox>
                <goab-checkbox name="special" value="special" text="Special Offers, Discounts, Deals"></goab-checkbox>
                <goab-checkbox name="events" value="events" text="Event Announcements"></goab-checkbox>
              </goab-checkbox-list>
            </goab-form-item>
          </goab-fieldset>
        </goab-public-form-page>

        <goab-public-form-page
          id="interests"
          heading="Areas of Interest"
          summaryHeading="Interests"
          (onContinue)="onPageChange($event, 'interests')"
        >
          <goab-fieldset>
            <goab-form-item
              id="topics-of-interest"
              name="Topics of Interest"
              label="What topics are you interested in?"
              helpText="Select all that apply"
              [publicFormSummaryOrder]="3"
            >
              <goab-checkbox-list name="topics-of-interest" [value]="topicsOfInterestValue" (onChange)="onTopicsOfInterestChange($event)">
                <goab-checkbox name="health" value="health" text="Health and Wellness"></goab-checkbox>
                <goab-checkbox name="education" value="education" text="Education, K-12, Post-secondary"></goab-checkbox>
                <goab-checkbox name="employment" value="employment" text="Employment Services"></goab-checkbox>
                <goab-checkbox name="business" value="business" text="Business, Economy, Trade"></goab-checkbox>
                <goab-checkbox name="environment" value="environment" text="Environment"></goab-checkbox>
              </goab-checkbox-list>
            </goab-form-item>
          </goab-fieldset>
        </goab-public-form-page>

        <goab-public-form-page
          id="summary"
          heading="Summary"
          type="summary"
          (onContinue)="onPageChange($event, 'summary')"
        >
          <goab-public-form-summary/>
        </goab-public-form-page>
      </goab-public-form>

      <goab-modal [open]="_showConfirmationModal" heading="Submit Communication Preferences">
        Your communication preferences and interests will be saved.
        <goab-button-group alignment="end">
          <goab-button type="tertiary" (onClick)="hideConfirmationModal()">Cancel</goab-button>
          <goab-button type="primary" (onClick)="submitPublicForm()">Submit</goab-button>
        </goab-button-group>
      </goab-modal>
